<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin Dashboard{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Admin Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('admin.index') }}">
        <i class="ti ti-shield-lock me-2"></i> Admin Panel
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">
          {% if current_user.is_authenticated %}
          <li class="nav-item d-flex align-items-center me-3">
            <span class="text-white">Xin chào, <strong>{{ current_user.name or current_user.username }}</strong></span>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="{{ url_for('auth.logout') }}">
              <i class="ti ti-logout"></i> Đăng xuất
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <div class="page">
    <div class="page-wrapper">
      {% block body %}{% endblock %}
    </div>
  </div>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
