{% extends "base.html" %}

{% block title %}Trang chủ{% endblock %}

{% block content %}
<h1>Chào mừng đến hệ thống việc làm</h1>
<p>Đây là trang chính.</p>

<div class="d-flex justify-content-center mt-4">
    <div class="card shadow-sm" style="width: 600px; border-radius: 10px; overflow: hidden;">
      <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{{ url_for('static', filename='images/img1.jpg') }}" class="d-block w-100" alt="Ảnh 1">
            </div>
            <div class="carousel-item">
              <img src="{{ url_for('static', filename='images/img2.jpg') }}" class="d-block w-100" alt="Ảnh 2">
            </div>
            <div class="carousel-item">
              <img src="{{ url_for('static', filename='images/img3.jpg') }}" class="d-block w-100" alt="Ảnh 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </button>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<style>
  /* Làm slide mượt hơn */
  .carousel-item {
    transition: transform 1s ease-in-out, opacity 1s ease-in-out;
    height: 250px; /* Giới hạn chiều cao */
    object-fit: cover; /* Crop ảnh cho đẹp */
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var myCarousel = document.querySelector('#carouselExampleIndicators');
    var carousel = new bootstrap.Carousel(myCarousel, {
      interval: 2000,  // 2 giây tự chạy
      ride: 'carousel',
      pause: false    
    });
  });
</script>
{% endblock %}
