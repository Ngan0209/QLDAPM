<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <a href="{{ url_for('home.index') }}">Trang chủ</a>
        <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
        <a href="{{ url_for('auth.register') }}">Đăng ký</a>
    </nav>

    <!-- Nội dung -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Job Management System</p>
    </footer>
</body>
</html>
